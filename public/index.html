<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Doanh Thu Bot Sói Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-2 text-center text-emerald-400">📊 DASHBOARD THỐNG KÊ VƯỢT LINK</h1>
        <p class="text-center text-slate-400 mb-8">Hệ thống quản lý doanh thu tự động (1,200 VNĐ / Lượt vượt)</p>

        <!-- Thẻ thống kê tổng quan -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm font-semibold">TỔNG LINK ĐÃ TẠO</h3>
                <p id="totalCreated" class="text-4xl font-bold text-blue-400 mt-2">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm font-semibold">VƯỢT THÀNH CÔNG</h3>
                <p id="totalSuccess" class="text-4xl font-bold text-emerald-400 mt-2">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm font-semibold">TỔNG DOANH THU (VNĐ)</h3>
                <p id="totalVND" class="text-4xl font-bold text-yellow-400 mt-2">0 đ</p>
            </div>
        </div>

        <!-- Bảng lịch sử gần đây -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h3 class="text-lg font-semibold mb-4 text-slate-200">🕒 Lịch sử vượt link gần đây</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="py-3 px-4">User ID Telegram</th>
                            <th class="py-3 px-4">Thời gian hoàn thành</th>
                            <th class="py-3 px-4">Thưởng</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="text-slate-300 text-sm">
                        <tr><td colspan="3" class="py-4 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if(data.success) {
                    document.getElementById('totalCreated').innerText = data.totalCreated;
                    document.getElementById('totalSuccess').innerText = data.totalSuccess;
                    document.getElementById('totalVND').innerText = data.totalVND.toLocaleString('vi-VN') + ' đ';

                    const tbody = document.getElementById('historyTable');
                    if(data.history.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">Chưa có lượt vượt link nào hôm nay.</td></tr>`;
                    } else {
                        tbody.innerHTML = data.history.map(item => `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                                <td class="py-3 px-4 font-mono text-cyan-400">${item.user}</td>
                                <td class="py-3 px-4">${item.time}</td>
                                <td class="py-3 px-4 text-emerald-400 font-semibold">+1,200 đ</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (e) {
                console.error("Lỗi tải thống kê:", e);
            }
        }
        fetchStats();
        setInterval(fetchStats, 5000); // Tự động cập nhật mỗi 5 giây
    </script>
</body>
</html>
