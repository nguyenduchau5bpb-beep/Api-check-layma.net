<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link - Sói Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .code { font-size: 32px; font-weight: bold; color: #38bdf8; background: #334155; padding: 15px 25px; border-radius: 8px; margin: 20px 0; display: inline-block; letter-spacing: 2px; }
        p { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎉 VƯỢT LINK THÀNH CÔNG!</h2>
        <p>Copy mã dưới đây và gửi vào Bot Telegram để nhận xu:</p>
        <div class="code" id="codeDisplay">Đang tải...</div>
        <p><small>Mã có hiệu lực trong 15 phút.</small></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
            document.getElementById('codeDisplay').innerText = code;
        } else {
            document.getElementById('codeDisplay').innerText = "MÃ KHÔNG HỢP LỆ!";
        }
    </script>
</body>
</html>
